<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="description" content="Contact boredprinter or ask us to remove a model link.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request removal – boredprinter</title>
<style>
:root{--bg:#F3F4F6;--surface:#FFFFFF;--fg:#1A1918;--muted:#646A75;--line:#E2E4E8;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:32px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:32px;letter-spacing:-.02em}p{margin:0;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
input,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{font:700 16px system-ui;padding:14px;border:0;border-radius:999px;background:#1A1918;color:#fff;cursor:pointer}
a{color:var(--muted)}
</style></head><body><main>
<a href="/">← boredprinter</a>
<h1>Contact &amp; removal</h1>
<p>boredprinter never hosts 3D files. We show a small preview image, the creator's name and a link to the original page. If you are the creator and want your model removed from boredprinter, send the link below and we'll remove it quickly.</p>
<form name="removal" method="POST" action="/api/contact">
  <p hidden><label>Leave empty <input name="company"></label></p>
  <label>Link to the model (optional) <input name="model_url" type="url" placeholder="https://makerworld.com/en/models/..."></label>
  <label>Your email <input name="email" type="email" required></label>
  <label>Message (optional) <textarea name="message" rows="3"></textarea></label>
  <button type="submit">Send request</button>
</form>
</main></body></html>
