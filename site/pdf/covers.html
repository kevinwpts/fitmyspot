<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Geist:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Geist}
/* platt omslag 600x800 */
.cv{width:600px;height:800px;position:relative;overflow:hidden;padding:52px 48px;display:flex;flex-direction:column}
.cv .br{display:flex;align-items:center;gap:10px;font:800 22px/1 "Bricolage Grotesque";letter-spacing:-.03em}
.cv .br svg{width:34px;height:34px}
.cv h1{font:800 66px/.95 "Bricolage Grotesque";letter-spacing:-.045em;margin:40px 0 0}
.cv p{font:500 21px/1.35 Geist;margin:20px 0 0;max-width:420px}
.cv .art{position:absolute;left:0;right:0;bottom:0;height:420px}
.cv .ft{position:absolute;left:48px;right:48px;bottom:40px;display:flex;justify-content:space-between;font:600 15px Geist;letter-spacing:.02em}
.pb{background:#141418;color:#fff}.pb p{color:#A9AAB3}.pb .ft{color:#8A8B94}
.ds{background:#FF5B1F;color:#16161A}.ds p{color:#3A1A0C}.ds .ft{color:#5A2510}
/* 3D-bok */
.stage{width:900px;height:1000px;display:grid;place-items:center;perspective:2200px}
.book{position:relative;width:600px;height:800px;transform-style:preserve-3d;transform:rotateY(-28deg) rotateX(6deg)}
.book .front{position:absolute;inset:0;transform:translateZ(22px);border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:inset 8px 0 14px -6px rgba(0,0,0,.35)}
.book .front::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.18) 100%);pointer-events:none}
.book .spine{position:absolute;top:0;left:0;width:44px;height:800px;transform:rotateY(-90deg) translateX(-22px);transform-origin:left;}
.book .pages{position:absolute;top:6px;right:0;width:42px;height:788px;transform:rotateY(90deg) translateZ(578px) translateX(-2px);background:repeating-linear-gradient(90deg,#F4F1EA 0 2px,#E1DDD3 2px 3px)}
.book .back{position:absolute;inset:0;transform:translateZ(-22px);border-radius:4px 10px 10px 4px}
.shadow{position:absolute;width:640px;height:80px;bottom:60px;left:150px;background:radial-gradient(ellipse at center,rgba(20,20,24,.45),rgba(20,20,24,0) 70%);filter:blur(8px)}
</style></head><body>

<!-- PLAYBOOK -->
<div id="pb" class="cv pb">
  <div class="br"><svg viewBox="0 0 64 64"><rect x="15" y="54" width="9" height="6" rx="2" fill="#fff"/><rect x="40" y="54" width="9" height="6" rx="2" fill="#fff"/><rect x="8" y="7" width="48" height="50" rx="11" fill="#fff"/><rect x="14" y="18" width="36" height="30" rx="6" fill="#141418"/><path d="M27 13h10v7l-5 5-5-5z" fill="#FF5B1F"/><path d="M19 33.5h10a5 5 0 0 1-10 0z" fill="#fff"/><path d="M35 33.5h10a5 5 0 0 1-10 0z" fill="#fff"/><path d="M28.5 43h7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>boredprinter</div>
  <h1 style="font-size:92px">Print to Profit</h1>
  <p>The complete guide to selling your 3D prints.</p>
  <svg class="art" viewBox="0 0 600 420" aria-hidden="true">
    <defs>
      <pattern id="layers" width="8" height="7" patternUnits="userSpaceOnUse"><rect width="8" height="7" fill="#FF5B1F"/><rect y="5.6" width="8" height="1.4" fill="#C93F0B"/></pattern>
      <pattern id="layersG" width="8" height="7" patternUnits="userSpaceOnUse"><rect width="8" height="7" fill="#2C2C33"/><rect y="5.6" width="8" height="1.4" fill="#222228"/></pattern>
      <linearGradient id="bed" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2A2A31"/><stop offset="1" stop-color="#1D1D22"/></linearGradient>
    </defs>
    <!-- grid lines -->
    <g stroke="#23232A" stroke-width="1">
      <line x1="48" y1="120" x2="552" y2="120"/><line x1="48" y1="190" x2="552" y2="190"/><line x1="48" y1="260" x2="552" y2="260"/>
    </g>
    <!-- printed bar chart (layers) -->
    <rect x="70" y="268" width="62" height="62" fill="url(#layersG)" rx="3"/>
    <rect x="160" y="238" width="62" height="92" fill="url(#layersG)" rx="3"/>
    <rect x="250" y="200" width="62" height="130" fill="url(#layers)" rx="3"/>
    <rect x="340" y="150" width="62" height="180" fill="url(#layers)" rx="3"/>
    <rect x="430" y="168" width="62" height="162" fill="url(#layers)" rx="3"/>
    <!-- bar being printed -->
    <rect x="430" y="96" width="62" height="72" fill="none" stroke="#FF5B1F" stroke-width="2" stroke-dasharray="5 6" rx="3" opacity=".55"/>
    <!-- nozzle + carriage -->
    <rect x="30" y="40" width="540" height="10" rx="5" fill="#34343C"/>
    <g transform="translate(461 0)">
      <rect x="-38" y="28" width="76" height="62" rx="12" fill="#F2F2F4"/>
      <rect x="-26" y="40" width="52" height="8" rx="4" fill="#D7D8DD"/>
      <path d="M-14 90h28l-8 30h-12z" fill="#C9CAD0"/>
      <path d="M-5 120h10l-3 14h-4z" fill="#FF5B1F"/>
      <rect x="-2" y="134" width="4" height="30" fill="#FF5B1F" opacity=".9"/>
    </g>
    <!-- build plate -->
    <rect x="40" y="330" width="520" height="22" rx="6" fill="url(#bed)"/>
    <rect x="40" y="330" width="520" height="4" rx="2" fill="#3A3A43"/>
    <!-- coin -->
    <g transform="translate(372 108)"><circle r="22" fill="#FFC23D"/><circle r="16" fill="none" stroke="#E0A215" stroke-width="3"/><text y="7" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="20" fill="#9A6A00">$</text></g>
  </svg>
  <div class="ft"><span>Premium guide</span><span>boredprinter.com</span></div>
</div>

<!-- DESIGN -->
<div id="ds" class="cv ds">
  <div class="br"><svg viewBox="0 0 64 64"><rect x="15" y="54" width="9" height="6" rx="2" fill="#16161A"/><rect x="40" y="54" width="9" height="6" rx="2" fill="#16161A"/><rect x="8" y="7" width="48" height="50" rx="11" fill="#16161A"/><rect x="14" y="18" width="36" height="30" rx="6" fill="#FFF8F1"/><path d="M27 13h10v7l-5 5-5-5z" fill="#FF5B1F"/><path d="M19 33.5h10a5 5 0 0 1-10 0z" fill="#16161A"/><path d="M35 33.5h10a5 5 0 0 1-10 0z" fill="#16161A"/><path d="M28.5 43h7" stroke="#16161A" stroke-width="2.6" stroke-linecap="round"/></svg>boredprinter</div>
  <h1>Design Your Own Bestseller</h1>
  <p>3D design for sellers. Make products that are 100% yours.</p>
  <svg class="art" viewBox="0 0 600 420" aria-hidden="true">
    <!-- blueprint grid -->
    <g stroke="#E8501A" stroke-width="1">
      <path d="M0 60H600M0 120H600M0 180H600M0 240H600M0 300H600M0 360H600"/>
      <path d="M60 0V420M120 0V420M180 0V420M240 0V420M300 0V420M360 0V420M420 0V420M480 0V420M540 0V420"/>
    </g>
    <!-- isometric box (wireframe → solid) -->
    <g transform="translate(300 178) scale(.86)">
      <path d="M0 -120 L150 -45 L0 30 L-150 -45 Z" fill="#FFE3D6"/>
      <path d="M-150 -45 L0 30 L0 140 L-150 65 Z" fill="#16161A"/>
      <path d="M150 -45 L0 30 L0 140 L150 65 Z" fill="#2B2B31"/>
      <!-- compartments on top -->
      <path d="M-75 -82.5 L75 -7.5" stroke="#16161A" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 -120 L0 -45 M-38 -64 L38 -101" stroke="#16161A" stroke-width="0" />
      <path d="M75 -82.5 L-75 -7.5" stroke="#16161A" stroke-width="5" stroke-linecap="round"/>
      <!-- dashed ghost (design) -->
      <path d="M0 -190 L150 -115 L150 -45 M0 -190 L-150 -115 L-150 -45 M0 -190 L0 -120" fill="none" stroke="#16161A" stroke-width="2.5" stroke-dasharray="7 8" opacity=".55"/>
      <!-- dimension -->
      <g stroke="#16161A" stroke-width="2.5" fill="#16161A" opacity=".85">
        <path d="M-165 80 L-15 155" /><path d="M-171 71 L-159 89 M-21 146 L-9 164"/>
      </g>
      <text x="-118" y="148" transform="rotate(26.6 -118 148)" font-family="Geist" font-weight="700" font-size="20" fill="#16161A">120 mm</text>
    </g>
    <!-- cursor -->
    <path d="M470 96 l0 46 l12 -11 l9 21 l9 -4 l-9 -21 l16 0 z" fill="#fff" stroke="#16161A" stroke-width="3" stroke-linejoin="round"/>
  </svg>
  <div class="ft"><span>Premium guide</span><span>boredprinter.com</span></div>
</div>

<!-- 3D-böcker -->
<div id="stage-pb" class="stage"><div style="position:relative"><div class="book"><div class="back" style="background:#0C0C0F"></div><div class="spine" style="background:#0B0B0E"></div><div class="pages"></div><div class="front" id="f-pb"></div></div></div><div class="shadow"></div></div>
<div id="stage-ds" class="stage"><div style="position:relative"><div class="book"><div class="back" style="background:#C93F0B"></div><div class="spine" style="background:#D9480F"></div><div class="pages"></div><div class="front" id="f-ds"></div></div></div><div class="shadow"></div></div>
<script>
document.getElementById("f-pb").append(Object.assign(document.getElementById("pb").cloneNode(true),{id:""}));
document.getElementById("f-ds").append(Object.assign(document.getElementById("ds").cloneNode(true),{id:""}));
</script>
</body></html>
