<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phone photo studio seen from above: window on the side, white card background, product, white card reflector, phone">
<style>.studio-t{font:600 15px Geist,system-ui,sans-serif;fill:#16161A}.studio-s{font:500 13px Geist,system-ui,sans-serif;fill:#5E6169}.studio-b{font:800 22px "Bricolage Grotesque",Geist,sans-serif;fill:#16161A}</style>
<rect width="720" height="380" rx="22" fill="#FFFFFF"/>
<text x="36" y="48" class="studio-b">Your 10-minute studio (seen from above)</text>
<!-- window -->
<rect x="36" y="90" width="18" height="230" rx="4" fill="#CFE6FF" stroke="#7AA9D9" stroke-width="2"/>
<text x="64" y="84" class="studio-t">Window</text><text x="64" y="102" class="studio-s">soft daylight</text>
<g fill="#FFE7A3" opacity=".75"><path d="M54 120L250 160L250 260L54 300z"/></g>
<!-- table -->
<rect x="200" y="110" width="360" height="210" rx="16" fill="#F3F1EC" stroke="#E7E4DD" stroke-width="2"/>
<!-- background card -->
<path d="M260 126H500" stroke="#16161A" stroke-width="6" stroke-linecap="round"/>
<text x="380" y="146" class="studio-s" text-anchor="middle">white card, curved up the wall</text>
<!-- product -->
<rect x="350" y="190" width="60" height="44" rx="8" fill="#FF5B1F"/>
<text x="380" y="256" class="studio-t" text-anchor="middle">Product</text>
<!-- reflector -->
<path d="M520 170V260" stroke="#B9BAC2" stroke-width="8" stroke-linecap="round"/>
<text x="580" y="210" class="studio-t">Reflector</text><text x="580" y="228" class="studio-s">white card</text>
<!-- phone -->
<rect x="362" y="300" width="36" height="58" rx="8" fill="#16161A"/><circle cx="380" cy="312" r="4" fill="#5E6169"/>
<path d="M380 298L380 244" stroke="#16161A" stroke-width="2" stroke-dasharray="4 5"/>
<text x="412" y="340" class="studio-t">Phone</text><text x="412" y="358" class="studio-s">main camera, no flash</text>
<text x="36" y="356" class="studio-s">Lights off inside.</text>
</svg>
