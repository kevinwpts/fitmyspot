<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The 5 photos every listing needs: hero, in use, size, details, variations">
<style>.sh-b{font:800 24px "Bricolage Grotesque",Geist,sans-serif;fill:#16161A}.sh-l{font:700 15px Geist,system-ui,sans-serif;fill:#16161A}.sh-n{font:800 15px Geist,system-ui,sans-serif;fill:#fff}</style>
<rect width="600" height="260" rx="22" fill="#FFFFFF"/>
<text x="28" y="44" class="sh-b">The 5 photos, in this order</text>
<g transform="translate(28 70)">
 <g class="pop"><rect width="98" height="98" rx="14" fill="#F4F2EE"/><rect x="29" y="34" width="40" height="40" rx="6" fill="#FF5B1F"/><circle cx="18" cy="18" r="13" fill="#16161A"/><text x="18" y="23" text-anchor="middle" class="sh-n">1</text><text x="49" y="126" text-anchor="middle" class="sh-l">Hero</text></g>
 <g transform="translate(110 0)"><g class="pop d2"><rect width="98" height="98" rx="14" fill="#F4F2EE"/><rect x="18" y="56" width="62" height="14" rx="3" fill="#C9C6BF"/><rect x="34" y="34" width="30" height="24" rx="5" fill="#FF5B1F"/><circle cx="18" cy="18" r="13" fill="#16161A"/><text x="18" y="23" text-anchor="middle" class="sh-n">2</text><text x="49" y="126" text-anchor="middle" class="sh-l">In use</text></g></g>
 <g transform="translate(220 0)"><g class="pop d3"><rect width="98" height="98" rx="14" fill="#F4F2EE"/><rect x="24" y="44" width="30" height="30" rx="5" fill="#FF5B1F"/><path d="M60 74V32" stroke="#16161A" stroke-width="3"/><path d="M56 36h8M56 46h6M56 56h8M56 66h6" stroke="#16161A" stroke-width="2"/><circle cx="18" cy="18" r="13" fill="#16161A"/><text x="18" y="23" text-anchor="middle" class="sh-n">3</text><text x="49" y="126" text-anchor="middle" class="sh-l">Size</text></g></g>
 <g transform="translate(330 0)"><g class="pop d4"><rect width="98" height="98" rx="14" fill="#F4F2EE"/><circle cx="52" cy="54" r="24" fill="none" stroke="#16161A" stroke-width="4"/><path d="M69 71l14 14" stroke="#16161A" stroke-width="5" stroke-linecap="round"/><rect x="42" y="46" width="20" height="16" rx="3" fill="#FF5B1F"/><circle cx="18" cy="18" r="13" fill="#16161A"/><text x="18" y="23" text-anchor="middle" class="sh-n">4</text><text x="49" y="126" text-anchor="middle" class="sh-l">Details</text></g></g>
