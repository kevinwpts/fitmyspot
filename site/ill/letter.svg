<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Under about 25 millimetres high, a product often ships as a large letter. Taller items become a parcel, which often costs 2 to 3 times more.">
<style>.le-b{font:800 24px "Bricolage Grotesque",Geist,sans-serif;fill:#16161A}.le-l{font:700 19px Geist,system-ui,sans-serif;fill:#16161A}.le-s{font:500 15px Geist,system-ui,sans-serif;fill:#5E6169}.le-g{font:800 19px Geist,system-ui,sans-serif;fill:#0E7A47}.le-r{font:800 19px Geist,system-ui,sans-serif;fill:#C2410C}</style>
<rect width="600" height="300" rx="22" fill="#FFFFFF"/>
<text x="28" y="44" class="le-b">A few millimetres can halve the postage</text>
<g transform="translate(28 84)">
 <rect x="0" y="76" width="230" height="26" rx="6" fill="#E9D8C4"/><rect class="grow" x="50" y="82" width="130" height="14" rx="3" fill="#FF5B1F"/>
 <text x="0" y="60" class="le-s">under ~25 mm high</text>
 <text x="0" y="140" class="le-l">Large letter</text><text x="0" y="166" class="le-g">Cheap</text>
</g>
<g transform="translate(318 84)">
 <rect x="0" y="36" width="230" height="66" rx="8" fill="#E9D8C4"/><rect class="grow d2" x="55" y="48" width="120" height="42" rx="4" fill="#FF5B1F"/>
 <text x="0" y="24" class="le-s">taller</text>
 <text x="0" y="140" class="le-l">Parcel</text><text x="0" y="166" class="le-r">often 2–3× the price</text>
</g>
<text x="28" y="284" class="le-s">Design flat, or print in parts. Check your own post's exact limits.</text>
</svg>
