<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Packing a 3D print: box, paper padding on all sides, the print in the middle, a thank-you note on top">
<style>.packing-t{font:600 15px Geist,system-ui,sans-serif;fill:#16161A}.packing-s{font:500 13px Geist,system-ui,sans-serif;fill:#5E6169}.packing-b{font:800 22px "Bricolage Grotesque",Geist,sans-serif;fill:#16161A}</style>
<rect width="720" height="360" rx="22" fill="#FFFFFF"/>
<text x="36" y="48" class="packing-b">Pack it so nothing moves</text>
<!-- box -->
<path d="M120 110H420V300H120z" fill="#E9C89B" stroke="#B88A50" stroke-width="3"/>
<path d="M120 110L160 80H460L420 110" fill="#F2D8B2" stroke="#B88A50" stroke-width="3"/>
<path d="M420 110L460 80V270L420 300" fill="#D9B07A" stroke="#B88A50" stroke-width="3"/>
<!-- padding -->
<g fill="#F7F3EA" stroke="#D9CFBF" stroke-width="2">
 <path d="M134 124h272v34h-272z"/><path d="M134 252h272v34h-272z"/><path d="M134 158h40v94h-40z"/><path d="M366 158h40v94h-40z"/>
</g>
<g stroke="#D9CFBF" stroke-width="1.5" fill="none"><path d="M150 140q20-10 40 0t40 0 40 0 40 0 40 0 40 0"/><path d="M150 268q20-10 40 0t40 0 40 0 40 0 40 0 40 0"/></g>
<!-- product -->
<rect x="186" y="168" width="168" height="74" rx="12" fill="#FF5B1F"/><path d="M230 168V242M270 168V242M310 168V242" stroke="#C2410C" stroke-width="3"/>
<!-- note -->
<rect x="260" y="118" width="110" height="34" rx="4" fill="#fff" stroke="#16161A" stroke-width="1.5" transform="rotate(-4 315 135)"/>
<text x="315" y="140" class="packing-s" text-anchor="middle" transform="rotate(-4 315 135)" style="fill:#16161A">Thank you! ♥</text>
<!-- labels -->
<g class="packing-t">
 <path d="M440 140H500" stroke="#B9BAC2"/><text x="508" y="136">2–3 cm padding</text><text x="508" y="154" class="packing-s">on every side</text>
 <path d="M354 205H500" stroke="#B9BAC2"/><text x="508" y="201">The print</text><text x="508" y="219" class="packing-s">thin parts extra protected</text>
 <path d="M372 128L500 90" stroke="#B9BAC2"/><text x="508" y="86">Thank-you note</text><text x="508" y="104" class="packing-s">brings reviews</text>
 <text x="508" y="262">Shake test</text><text x="508" y="280" class="packing-s">hear it move? add padding</text>
</g>
</svg>
