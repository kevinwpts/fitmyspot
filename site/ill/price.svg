<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where the price of a 3D print goes: filament is the smallest part, your time the biggest">
<style>.price-t{font:600 15px Geist,system-ui,sans-serif;fill:#16161A}.price-s{font:500 13px Geist,system-ui,sans-serif;fill:#5E6169}.price-b{font:800 22px "Bricolage Grotesque",Geist,sans-serif;fill:#16161A}</style>
<rect width="720" height="360" rx="22" fill="#FFFFFF"/>
<text x="36" y="48" class="price-b">Where a $20 price goes</text>
<g transform="translate(36 80)">
 <!-- stacked bar -->
 <rect x="80" y="182" width="120" height="18" fill="#FFB08F"/>
 <rect x="80" y="178" width="120" height="4" fill="#FFD3BF"/>
 <rect x="80" y="160" width="120" height="18" fill="#FF8A57"/>
 <rect x="80" y="110" width="120" height="50" fill="#FF5B1F"/>
 <rect x="80" y="100" width="120" height="10" fill="#C2410C"/>
 <rect x="80" y="20" width="120" height="80" fill="#0E7A47"/>
 <rect x="80" y="0" width="120" height="20" fill="#2B2B31"/>
 <rect x="80" y="0" width="120" height="200" rx="8" fill="none" stroke="#16161A" stroke-width="2"/>
 <g class="price-t">
  <line x1="200" y1="191" x2="236" y2="191" stroke="#B9BAC2"/><text x="244" y="196">Filament <tspan class="price-s">$1.32 · the smallest part</tspan></text>
  <line x1="200" y1="169" x2="236" y2="169" stroke="#B9BAC2"/><text x="244" y="174">Power + machine <tspan class="price-s">$0.84</tspan></text>
  <line x1="200" y1="135" x2="236" y2="135" stroke="#B9BAC2"/><text x="244" y="140">Your time <tspan class="price-s">$5.00 · the biggest cost</tspan></text>
  <line x1="200" y1="105" x2="236" y2="105" stroke="#B9BAC2"/><text x="244" y="110">Packaging <tspan class="price-s">$1.00</tspan></text>
  <line x1="200" y1="60" x2="236" y2="60" stroke="#B9BAC2"/><text x="244" y="65" style="fill:#0E7A47">Profit <tspan class="price-s">from the × 2.5 markup</tspan></text>
  <line x1="200" y1="10" x2="236" y2="10" stroke="#B9BAC2"/><text x="244" y="15">Marketplace fees <tspan class="price-s">on top</tspan></text>
 </g>
</g>
<text x="36" y="326" class="price-s">Example: a desk organizer. Filament is under 7% of the price. Price by your time, not your plastic.</text>
</svg>
