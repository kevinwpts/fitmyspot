<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A week with two blocks: Tuesday evening design and print, Saturday morning photos, listing and posts. 4 hours a week.">
<style>.wk-b{font:800 24px "Bricolage Grotesque",Geist,sans-serif;fill:#16161A}.wk-d{font:700 17px Geist,system-ui,sans-serif;fill:#5E6169}.wk-t{font:700 16px Geist,system-ui,sans-serif;fill:#fff}.wk-s{font:600 14px Geist,system-ui,sans-serif;fill:#fff}.wk-n{font:700 18px Geist,system-ui,sans-serif;fill:#16161A}</style>
<rect width="600" height="300" rx="22" fill="#FFFFFF"/>
<text x="28" y="44" class="wk-b">Your week: 2 blocks, 4 hours</text>
<g transform="translate(28 66)">
 <g class="wk-d"><text x="22" y="18" text-anchor="middle">Mon</text><text x="100" y="18" text-anchor="middle">Tue</text><text x="178" y="18" text-anchor="middle">Wed</text><text x="256" y="18" text-anchor="middle">Thu</text><text x="334" y="18" text-anchor="middle">Fri</text><text x="412" y="18" text-anchor="middle">Sat</text><text x="490" y="18" text-anchor="middle">Sun</text></g>
 <g fill="#F4F2EE"><rect x="0" y="30" width="70" height="170" rx="12"/><rect x="78" y="30" width="70" height="170" rx="12"/><rect x="156" y="30" width="70" height="170" rx="12"/><rect x="234" y="30" width="70" height="170" rx="12"/><rect x="312" y="30" width="70" height="170" rx="12"/><rect x="390" y="30" width="70" height="170" rx="12"/><rect x="468" y="30" width="70" height="170" rx="12"/></g>
 <g class="grow"><rect x="78" y="120" width="70" height="70" rx="12" fill="#FF5B1F"/><text x="113" y="150" text-anchor="middle" class="wk-t">Design</text><text x="113" y="172" text-anchor="middle" class="wk-s">2 h</text></g>
 <g class="grow d2"><rect x="390" y="40" width="70" height="70" rx="12" fill="#16161A"/><text x="425" y="70" text-anchor="middle" class="wk-t">Photos</text><text x="425" y="92" text-anchor="middle" class="wk-s">2 h</text></g>
</g>
<text x="28" y="290" class="wk-n" style="font-size:15px;fill:#5E6169">Same times every week. Put them in your calendar like an appointment.</text>
</svg>
